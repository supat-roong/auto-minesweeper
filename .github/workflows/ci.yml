name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 exercises the `tomli` fallback in config.py; 3.11+ uses stdlib tomllib.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Playwright browsers and ffmpeg aren't available on the runner, so the
      # integration suite stays deselected. The solver submodule IS checked out,
      # so solver_bridge imports cleanly during collection.
      - name: Run unit tests
        run: pytest -m "not integration" -v
